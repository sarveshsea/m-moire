name: Native candidate validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/2.8-*"]

permissions:
  contents: read

concurrency:
  group: native-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-candidate:
    name: native candidate / ${{ matrix.offlineTarget }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - binaryTarget: darwin-arm64
            offlineTarget: darwin-arm64
            runner: macos-14
            esbuildPackage: darwin-arm64
          - binaryTarget: darwin-x64
            offlineTarget: darwin-x64
            runner: macos-15-intel
            esbuildPackage: darwin-x64
          - binaryTarget: linux-arm64
            offlineTarget: linux-arm64
            runner: ubuntu-24.04-arm
            esbuildPackage: linux-arm64
          - binaryTarget: linux-x64
            offlineTarget: linux-x64
            runner: ubuntu-latest
            esbuildPackage: linux-x64
          - binaryTarget: win-x64
            offlineTarget: windows-x64
            runner: windows-latest
            esbuildPackage: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies without lifecycle scripts
        run: npm ci --include=optional --ignore-scripts

      # Match release packaging: Vite uses its nested esbuild version.
      - name: Ensure platform esbuild binary
        shell: bash
        run: |
          ESBUILD_VERSION="$(node -p "require('./node_modules/vite/node_modules/esbuild/package.json').version")"
          npm install --no-save --package-lock=false --ignore-scripts "@esbuild/${{ matrix.esbuildPackage }}@${ESBUILD_VERSION}"

      - name: Restore exact repository bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git archive --format=tar HEAD | tar --extract --file=-
          git diff --exit-code

      - name: Typecheck candidate
        run: npm run typecheck

      - name: Build candidate
        run: npm run build

      - name: Compile native binary
        run: node scripts/build-binary.mjs --target=${{ matrix.binaryTarget }}

      - name: Build deterministic offline bundle
        run: node scripts/build-offline-bundle.mjs --target=${{ matrix.offlineTarget }}

      - name: Verify standalone version and locked diagnosis
        run: node scripts/smoke-standalone.mjs dist-bin/memi-${{ matrix.binaryTarget }}
