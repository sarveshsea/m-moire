name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/2.8-*"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm install --ignore-scripts
      - name: Install DesignWorkBench runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium
      - run: npm run check:release
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Verify plugin bundle version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          META_VERSION=$(node -p "require('./plugin/widget-meta.json').packageVersion")
          if [ "$PKG_VERSION" != "$META_VERSION" ]; then
            echo "ERROR: widget-meta.json ($META_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Plugin version $META_VERSION matches package.json"

  # Dogfood: memi gates its own repo with its own policy + committed baseline.
  # Runs the CLI built from HEAD (not the published package) so the gate tests
  # the code under review.
  memi-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: memi ci (self-gate)
        run: node dist/index.js --profile connected --allow project-write --allow source-content-persistence --allow shell ci
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1b168cd39490f61582a9beae412bb7057a6b2c4e # v4.31.8
        with:
          sarif_file: .memoire/app-quality/memi-results.sarif
          category: memi-design

  frontend-workflow:
    name: Frontend workflow (checked-in connector evidence replay)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            npm-shrinkwrap.json
            examples/frontend-workflow/package-lock.json
      - run: npm ci --include=optional --ignore-scripts
      - run: npm run build
      - run: npm run stage:package
      - name: Pack the staged candidate
        working-directory: .dist/npm-package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/frontend-package"
      - name: Install the candidate in a separate consumer
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/frontend-consumer"
          mkdir -p "$consumer"
          printf '{"name":"frontend-artifact-consumer","version":"0.0.0","private":true}\n' > "$consumer/package.json"
          artifacts=("$RUNNER_TEMP"/frontend-package/*.tgz)
          test "${#artifacts[@]}" -eq 1
          npm install --ignore-scripts --prefix "$consumer" "${artifacts[0]}"
          entry="$consumer/node_modules/@memi-design/cli/dist/index.js"
          test -f "$entry"
          echo "MEMI_INSTALLED_ENTRY=$entry" >> "$GITHUB_ENV"
      - name: Install the private fixture dependencies
        run: npm ci --ignore-scripts --prefix examples/frontend-workflow
      - name: Install Chromium for the fixture
        working-directory: examples/frontend-workflow
        run: npx playwright install --with-deps chromium
      - name: Typecheck the reusable component fixture
        working-directory: examples/frontend-workflow
        run: npm run typecheck
      - name: Build Storybook into the ignored artifact directory
        working-directory: examples/frontend-workflow
        run: npm run build
      - name: Verify mapped reuse and rendered keyboard, theme and responsive states
        working-directory: examples/frontend-workflow
        run: npm test
      - name: Upload frontend replay receipts and browser screenshots
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: frontend-workflow-replay
          path: examples/frontend-workflow/.dist/review
          include-hidden-files: true
          if-no-files-found: warn
